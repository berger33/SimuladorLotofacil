name: CI - Lotofácil Pro

on:
  push:
    branches: [ master, Aplicativo, arena/* ]
  pull_request:
    branches: [ master, Aplicativo ]

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests pandas
          # Opcionais
          pip install xgboost || echo "xgboost skip"
          
      - name: Test original core
        run: |
          pytest tests/test_core.py -v
          
      - name: Test core_shared
        run: |
          pytest android_app/core_shared/tests/test_core_shared.py -v || echo "core_shared tests skip if no core"

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API deps
        run: |
          pip install fastapi uvicorn pydantic httpx
      - name: Test API import
        run: |
          cd android_app/api
          python -c "import main; print('API main ok')"
          python -c "import main_real; print('API real ok')" || echo "main_real skip"

  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      - name: Check Flutter
        run: |
          cd android_app/flutter_pro
          flutter pub get || echo "pub get may fail without full setup"
          flutter analyze || echo "analyze skip"
          # flutter build apk --debug || echo "build skip"

  build-kivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Kivy
        run: |
          pip install kivy kivymd
          cd android_app/kivy_mvp
          python -m py_compile main.py
          python -m py_compile main_real.py || echo "main_real compile skip"
