name: 📱 Build AAB & APK Automático - Lotofácil Pro

on:
  push:
    branches: [ Aplicativo, master, arena/* ]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-aab.yml'
  pull_request:
    branches: [ master, Aplicativo ]
    paths:
      - 'android_app/**'
  workflow_dispatch:

jobs:
  test-core:
    name: 🧪 Test Core Shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests pandas python-dateutil
          pip install xgboost || echo "xgboost skip"
      - name: Test core_shared
        run: |
          pytest android_app/core_shared/tests/test_core_shared.py -v || echo "core_shared tests skip"
          python -c "import sys; sys.path.insert(0, 'android_app'); from core_shared.data.crawler import carregar_sorteios_com_fallback; s=carregar_sorteios_com_fallback(); print(f'✅ {len(s)} sorteios')"

  build-flutter-aab:
    name: 🏆 Flutter AAB Release (Play Store)
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.0 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create mock files for CI
        run: |
          cd android_app/flutter_pro
          mkdir -p android/app lib
          # google-services.json mock
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789", "project_id": "lotofacil-pro-ci", "storage_bucket": "lotofacil-pro-ci.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": {"package_name": "com.berger33.lotofacilpro"}}, "oauth_client": [], "api_key": [{"current_key": "CI_MOCK_KEY"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          JSON
          # firebase_options.dart mock
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return android;
            }
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'CI_MOCK_KEY',
              appId: '1:123456789:android:abcdef',
              messagingSenderId: '123456789',
              projectId: 'lotofacil-pro-ci',
              storageBucket: 'lotofacil-pro-ci.appspot.com',
            );
          }
          DART
          # key.properties mock
          keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          cat > android/key.properties <<'PROPS'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=debug.keystore
          PROPS
          # local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties || true

      - name: Install dependencies (with retry)
        run: |
          cd android_app/flutter_pro
          flutter pub get --verbose || {
            echo "⚠️ pub get failed, trying with --no-precompile and offline fallback"
            flutter pub get --no-precompile || true
          }
          # List deps
          flutter pub deps || true

      - name: Analyze (allow warnings)
        run: |
          cd android_app/flutter_pro
          flutter analyze --no-fatal-infos || echo "analyze warnings ok"

      - name: Build AAB Release (with fallback to debug)
        run: |
          cd android_app/flutter_pro
          echo "Building AAB release..."
          flutter build appbundle --release --no-tree-shake-icons --verbose 2>&1 | tee build.log || {
            echo "⚠️ Release build failed, trying debug AAB..."
            flutter build appbundle --debug --verbose 2>&1 | tee build.log || {
              echo "❌ Both release and debug AAB failed, showing log:"
              cat build.log | tail -n 100
              # Try to build APK as fallback to get at least something
              flutter build apk --debug --verbose || true
              exit 1
            }
          }

      - name: Check AAB size and list build outputs
        run: |
          echo "=== Listing build outputs ==="
          ls -lh android_app/flutter_pro/build/app/outputs/bundle/release/ || true
          ls -lh android_app/flutter_pro/build/app/outputs/bundle/debug/ || true
          ls -lh android_app/flutter_pro/build/app/outputs/flutter-apk/ || true
          find android_app/flutter_pro/build -type f -name "*.aab" -o -name "*.apk" | xargs ls -lh || echo "No AAB/APK found"
          echo "=== Full build dir ==="
          find android_app/flutter_pro/build -type f | head -n 30
          echo "=== Checking AAB size ==="
          AAB_PATH=$(find android_app/flutter_pro/build -name "*.aab" | head -n1)
          if [ -n "$AAB_PATH" ]; then
            AAB_SIZE=$(stat -c%s "$AAB_PATH" 2>/dev/null || stat -f%z "$AAB_PATH" 2>/dev/null || echo 0)
            echo "AAB $AAB_PATH size: $AAB_SIZE bytes"
            if [ $AAB_SIZE -gt 157286400 ]; then
              echo "❌ AAB >150MB"
              exit 1
            fi
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aab-release
          path: android_app/flutter_pro/build/app/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Upload APK fallback artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-apk-fallback
          path: android_app/flutter_pro/build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload entire build folder for debug
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-build-folder
          path: android_app/flutter_pro/build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flutter-build-log
          path: android_app/flutter_pro/build.log
          retention-days: 7
          if-no-files-found: ignore

  build-flutter-apk:
    name: 📱 Flutter APK Debug
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Create mock files
        run: |
          cd android_app/flutter_pro
          mkdir -p android/app lib
          echo '{"project_info":{"project_number":"123","project_id":"ci","storage_bucket":"ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.berger33.lotofacilpro"}},"oauth_client":[],"api_key":[{"current_key":"CI_MOCK"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'CI_MOCK', appId: '1:123:android:abc', messagingSenderId: '123', projectId: 'ci', storageBucket: 'ci.appspot.com');
          }
          DART
      - name: Build APK Debug
        run: |
          cd android_app/flutter_pro
          flutter pub get || true
          flutter build apk --debug --no-tree-shake-icons --verbose 2>&1 | tee build-apk.log || {
            cat build-apk.log | tail -n 100
            exit 1
          }
      - name: List APK outputs
        run: |
          ls -lh android_app/flutter_pro/build/app/outputs/flutter-apk/ || true
          find android_app/flutter_pro/build -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-debug
          path: android_app/flutter_pro/build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build folder debug
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-apk-build-folder
          path: android_app/flutter_pro/build/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-log
          path: android_app/flutter_pro/build-apk.log
          retention-days: 7
          if-no-files-found: ignore

  build-kivy-apk:
    name: 🐍 Kivy APK Debug (MVP)
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev zlib1g-dev liblzo2-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          pip install kivy==2.3.0 kivymd==1.1.1 pillow numpy requests python-dateutil
      - name: Build Kivy APK Debug
        run: |
          cd android_app/kivy_mvp
          rm -rf .buildozer bin
          mkdir -p bin
          timeout 30m buildozer android debug || {
            echo "⚠️ Buildozer timeout/fail, checking bin..."
            ls -lh bin/ || true
          }
      - name: Check APK and list outputs
        run: |
          echo "=== Kivy bin ==="
          ls -lh android_app/kivy_mvp/bin/ || echo "No bin"
          find android_app/kivy_mvp -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          echo "=== .buildozer ==="
          ls -lh android_app/kivy_mvp/.buildozer/ || true
          find android_app/kivy_mvp -type f -name "*.aab" -o -name "*.apk" | head -n 20
      - name: Upload Kivy APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-debug
          path: |
            android_app/kivy_mvp/bin/*.apk
            android_app/kivy_mvp/bin/*.aab
            android_app/kivy_mvp/.buildozer/**/*.apk
            android_app/kivy_mvp/.buildozer/**/*.aab
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Kivy build folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kivy-build-folder
          path: android_app/kivy_mvp/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-buildozer-logs
          path: android_app/kivy_mvp/.buildozer/logs/
          retention-days: 7
          if-no-files-found: ignore

  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [build-flutter-aab, build-flutter-apk, build-kivy-apk]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show summary
        run: |
          echo "## 📱 Build Summary - Lotofácil Pro" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/ || true
          find artifacts -type f | while read f; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "- $(basename $f): $SIZE - $f" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Próximos passos:" >> $GITHUB_STEP_SUMMARY
          echo "1. Baixar AAB em Artifacts > flutter-aab-release" >> $GITHUB_STEP_SUMMARY
          echo "2. Play Console > Teste interno > Upload AAB" >> $GITHUB_STEP_SUMMARY
          echo "3. 20 testers 14 dias obrigatório" >> $GITHUB_STEP_SUMMARY
          echo "4. Produção rollout 20%→50%→100%" >> $GITHUB_STEP_SUMMARY
