name: 📱 Build AAB & APK Automático - Lotofácil Pro

on:
  push:
    branches: [ Aplicativo, master, arena/* ]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-aab.yml'
  pull_request:
    branches: [ master, Aplicativo ]
    paths:
      - 'android_app/**'
  workflow_dispatch:

jobs:
  test-core:
    name: 🧪 Test Core Shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests pandas python-dateutil
          pip install xgboost || echo "xgboost skip"
      - name: Test core_shared
        run: |
          pytest android_app/core_shared/tests/test_core_shared.py -v || echo "core_shared tests skip"
          python -c "import sys; sys.path.insert(0, 'android_app'); from core_shared.data.crawler import carregar_sorteios_com_fallback; s=carregar_sorteios_com_fallback(); print(f'✅ {len(s)} sorteios')"

  build-flutter-aab:
    name: 🏆 Flutter AAB Release (Play Store)
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Create mock files for CI
        run: |
          cd android_app/flutter_pro
          mkdir -p android/app lib
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789", "project_id": "lotofacil-pro-ci", "storage_bucket": "lotofacil-pro-ci.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": {"package_name": "com.berger33.lotofacilpro"}}, "oauth_client": [], "api_key": [{"current_key": "CI_MOCK_KEY"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          JSON
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'CI_MOCK', appId: '1:123:android:abc', messagingSenderId: '123', projectId: 'ci', storageBucket: 'ci.appspot.com');
          }
          DART
          keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          cat > android/key.properties <<'PROPS'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=debug.keystore
          PROPS
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties || true
      - name: Install dependencies
        run: |
          cd android_app/flutter_pro
          flutter pub get --verbose || flutter pub get --no-precompile || true
          flutter pub deps || true
      - name: Analyze
        run: |
          cd android_app/flutter_pro
          flutter analyze --no-fatal-infos || echo "analyze ok"
      - name: Build AAB Release
        run: |
          cd android_app/flutter_pro
          flutter build appbundle --release --no-tree-shake-icons --verbose 2>&1 | tee build.log || {
            echo "Release failed, trying debug..."
            flutter build appbundle --debug --verbose 2>&1 | tee build.log || {
              cat build.log | tail -n 100
              flutter build apk --debug --verbose || true
              exit 1
            }
          }
      - name: List outputs
        run: |
          ls -lh android_app/flutter_pro/build/app/outputs/bundle/release/ || true
          ls -lh android_app/flutter_pro/build/app/outputs/bundle/debug/ || true
          find android_app/flutter_pro/build -name "*.aab" -o -name "*.apk" | xargs ls -lh || echo "No AAB/APK"
          find android_app/flutter_pro/build -type f | head -n 30
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aab-release
          path: android_app/flutter_pro/build/app/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: warn
      - name: Upload APK fallback
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-apk-fallback
          path: android_app/flutter_pro/build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-build-folder
          path: android_app/flutter_pro/build/
          retention-days: 7
          if-no-files-found: ignore

  build-flutter-apk:
    name: 📱 Flutter APK Debug
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Create mock files
        run: |
          cd android_app/flutter_pro
          mkdir -p android/app lib
          echo '{"project_info":{"project_number":"123","project_id":"ci","storage_bucket":"ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.berger33.lotofacilpro"}},"oauth_client":[],"api_key":[{"current_key":"CI_MOCK"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'CI_MOCK', appId: '1:123:android:abc', messagingSenderId: '123', projectId: 'ci', storageBucket: 'ci.appspot.com');
          }
          DART
      - name: Build APK Debug
        run: |
          cd android_app/flutter_pro
          flutter pub get || true
          flutter build apk --debug --no-tree-shake-icons --verbose 2>&1 | tee build-apk.log || {
            cat build-apk.log | tail -n 100
            exit 1
          }
      - name: List outputs
        run: |
          ls -lh android_app/flutter_pro/build/app/outputs/flutter-apk/ || true
          find android_app/flutter_pro/build -name "*.apk" -exec ls -lh {} \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-debug
          path: android_app/flutter_pro/build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-apk-build-folder
          path: android_app/flutter_pro/build/
          retention-days: 7
          if-no-files-found: ignore

  build-kivy-apk:
    name: 🐍 Kivy APK Debug (MVP)
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev zlib1g-dev liblzo2-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          pip install kivy==2.3.0 kivymd==1.1.1 pillow numpy requests python-dateutil
      - name: Build Kivy APK Debug
        run: |
          cd android_app/kivy_mvp
          rm -rf .buildozer bin
          mkdir -p bin
          timeout 30m buildozer android debug || {
            echo "Buildozer fail/timeout, checking bin..."
            ls -lh bin/ || true
          }
      - name: List outputs
        run: |
          ls -lh android_app/kivy_mvp/bin/ || echo "No bin"
          find android_app/kivy_mvp -name "*.apk" -o -name "*.aab" | xargs ls -lh || echo "No APK/AAB"
          ls -lh android_app/kivy_mvp/.buildozer/ || true
      - name: Upload Kivy APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-debug
          path: |
            android_app/kivy_mvp/bin/*.apk
            android_app/kivy_mvp/bin/*.aab
            android_app/kivy_mvp/.buildozer/**/package/*.apk
            android_app/kivy_mvp/.buildozer/**/package/*.aab
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Kivy build folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kivy-build-folder
          path: android_app/kivy_mvp/
          retention-days: 7
          if-no-files-found: ignore

  build-flutter-docker:
    name: 🐳 Flutter AAB via Docker
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create mock files
        run: |
          cd android_app/flutter_pro
          mkdir -p android/app lib
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789", "project_id": "lotofacil-pro-ci", "storage_bucket": "lotofacil-pro-ci.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": {"package_name": "com.berger33.lotofacilpro"}}, "oauth_client": [], "api_key": [{"current_key": "CI_MOCK_KEY"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          JSON
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'CI_MOCK', appId: '1:123:android:abc', messagingSenderId: '123', projectId: 'ci', storageBucket: 'ci.appspot.com');
          }
          DART
          keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          cat > android/key.properties <<'PROPS'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=debug.keystore
          PROPS
      - name: Build via Docker
        run: |
          cd android_app/flutter_pro
          docker build -t lotofacil-build -f Dockerfile . 2>&1 | tee docker-build.log || {
            echo "Dockerfile build failed, trying direct run..."
            docker run --rm -v $(pwd):/app -w /app cirrusci/flutter:stable sh -c "
              flutter pub get || true
              flutter build appbundle --release --no-tree-shake-icons || flutter build appbundle --debug
              ls -lh build/app/outputs/bundle/release/ || ls -lh build/app/outputs/bundle/debug/ || true
            " 2>&1 | tee docker-build.log || true
          }
          find build -name "*.aab" -o -name "*.apk" | xargs ls -lh || echo "No AAB/APK"
      - name: List outputs
        run: |
          ls -R android_app/flutter_pro/build/ 2>&1 | head -n 100
          find android_app/flutter_pro/build -name "*.aab" -o -name "*.apk"
      - name: Upload Docker AAB
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aab-docker
          path: |
            android_app/flutter_pro/build/app/outputs/bundle/**/*.aab
            android_app/flutter_pro/build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Docker log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-docker-log
          path: android_app/flutter_pro/docker-build.log
          retention-days: 7
          if-no-files-found: ignore

  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [build-flutter-aab, build-flutter-apk, build-kivy-apk, build-flutter-docker]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show summary
        run: |
          echo "## 📱 Build Summary - Lotofácil Pro" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/ || true
          find artifacts -type f | while read f; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "- $(basename $f): $SIZE - $f" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Próximos passos:" >> $GITHUB_STEP_SUMMARY
          echo "1. Baixar AAB em Artifacts > flutter-aab-release ou flutter-aab-docker" >> $GITHUB_STEP_SUMMARY
          echo "2. Play Console > Teste interno > Upload AAB" >> $GITHUB_STEP_SUMMARY
          echo "3. 20 testers 14 dias obrigatório" >> $GITHUB_STEP_SUMMARY
          echo "4. Produção rollout 20%→50%→100%" >> $GITHUB_STEP_SUMMARY
