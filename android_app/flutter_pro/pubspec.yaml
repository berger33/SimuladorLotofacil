name: lotofacil_pro
description: Lotofácil Pro - Laboratório de IA para análise estatística da Lotofácil. Ferramenta educacional.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  confetti: ^0.7.0
  material_symbols_icons: ^4.2719.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.9
  firebase_messaging: ^14.7.10
  firebase_remote_config: ^4.3.8
  
  # Monetization
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.11
  
  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  package_info_plus: ^8.0.0
  device_info_plus: ^9.1.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  retrofit_generator: ^8.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#6F42C1"
    theme_color: "#6F42C1"

flutter_native_splash:
  color: "#121212"
  image: assets/images/splash.png
  android_12:
    image: assets/images/splash.png
    color: "#121212"
